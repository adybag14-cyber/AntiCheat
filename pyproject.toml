[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anticheat-system-research"
version = "0.2.0"
description = "Passive, evidence-oriented host observation for anti-cheat systems research"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "AntiCheat research contributors" }]
dependencies = []
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.1",
  "ruff==0.16.5",
]

[project.scripts]
anticheat-system = "anticheat_system.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
