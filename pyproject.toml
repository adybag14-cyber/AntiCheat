[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anticheat-system-research"
version = "0.1.0"
description = "Passive, evidence-oriented host observation for anti-cheat systems research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AntiCheat research contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy==2.3.1",
  "ruff==0.16.5",
]

[project.scripts]
anticheat-system = "anticheat_system.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
